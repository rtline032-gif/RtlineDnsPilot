name: Publish reviewed Windows release

on:
  push:
    branches: [main]
    paths:
      - release.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtline-dns-pilot-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rtline032-gif/RtlineDnsPilot' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up compiler and legacy targeting packs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            6.0.428
      - name: Set up Node.js for receiver tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and verify both Windows runtime packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((dotnet --version) -notmatch '^10\.') { throw 'The .NET 10 compiler is required for both source targets.' }
          $taskDotnetRoot = Split-Path -Parent (Get-Command dotnet).Source
          ./build.ps1 -Destination "$env:RUNNER_TEMP/release-builds/win-x64"
          ./build.ps1 -Windows7 -LegacySdkDirectory $taskDotnetRoot -Destination "$env:RUNNER_TEMP/release-builds/win7-x64"
          node ./receiver/google-apps-script/receiver-tests.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Receiver verification failed.' }
      - name: Package, verify uploads, publish and advance update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/publish-release.ps1 -Mode Publish -ModernDirectory "$env:RUNNER_TEMP/release-builds/win-x64" -LegacyDirectory "$env:RUNNER_TEMP/release-builds/win7-x64" -OutputDirectory "$env:RUNNER_TEMP/release-output"
      - name: Retain publication receipt and packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RtlineDnsPilot-release-receipt
          path: |
            ${{ runner.temp }}/release-output/*.zip
            ${{ runner.temp }}/release-output/*.json
            ${{ runner.temp }}/release-output/*.txt
          if-no-files-found: warn
          retention-days: 14
