name: Windows build and verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build application and run C# verification
        shell: pwsh
        run: ./build.ps1 -Destination "$env:RUNNER_TEMP/RtlineDnsPilot"
      - name: Verify receiver with mocked Google services
        shell: pwsh
        run: node ./receiver/google-apps-script/receiver-tests.cjs
      - name: Prepare unsigned distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskPackage = Join-Path $env:RUNNER_TEMP 'RtlineDnsPilot'
          foreach ($taskFile in @('README.txt','CHANNELS.txt','profiles.json','LICENSE','PRIVACY.md','CODE_SIGNING.md')) {
            Copy-Item -LiteralPath $taskFile -Destination (Join-Path $taskPackage $taskFile)
          }
          $taskSums = Get-ChildItem -LiteralPath $taskPackage -File | Sort-Object Name | ForEach-Object {
            (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          }
          $taskSums | Set-Content -LiteralPath (Join-Path $taskPackage 'SHA256SUMS.txt') -Encoding utf8
          $taskRelease = Join-Path $env:RUNNER_TEMP 'unsigned-release'
          New-Item -ItemType Directory -Path $taskRelease -Force | Out-Null
          Compress-Archive -LiteralPath $taskPackage -DestinationPath (Join-Path $taskRelease 'RtlineDnsPilot-win-x64-unsigned.zip')
      - name: Upload unsigned archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RtlineDnsPilot-win-x64-unsigned
          path: ${{ runner.temp }}/unsigned-release/*.zip
          if-no-files-found: error
          retention-days: 14
